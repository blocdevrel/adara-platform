<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Adara — Data and tools that make AI understand Africa</title>
    <meta name="description" content="Adara builds African language corpora, specialized models, and developer APIs so AI understands Africa — in its languages, culture, commerce, and on its own terms." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta property="og:title" content="Adara — Data and tools that make AI understand Africa" />
    <meta property="og:description" content="African language corpora, specialized models, and context APIs — built with local researchers and communities so AI serves Africa on its own terms." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon-192.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@adaraailab" />
    <meta name="twitter:title" content="Adara — Data and tools that make AI understand Africa" />
    <meta name="twitter:description" content="African language corpora, specialized models, and context APIs — built with local researchers and communities." />
    <meta name="twitter:image" content="/favicon-192.png" />

    <script>
      (function () {
        try {
          var key = "adara-ui-theme";
          var stored = localStorage.getItem(key);
          if (stored === "dark") {
            localStorage.setItem(key, "system");
            stored = "system";
          }
          var theme = stored || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.toggle(
            "dark",
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
